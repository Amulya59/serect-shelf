
<div class="bg vh-100 d-flex align-items-center justify-content-center" [ngClass]="role === 'seller' ? 'seller-bg' : 'buyer-bg'">

  <div class="glass-card">
    
    <h1 class="justify-content-start">Register</h1>
    <form>
      <div class="mb-3" >
        
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          id="exampleInputEmail1"
          aria-describedby="emailHelp"
          placeholder="Email"
        />
      </div>

      <!-- Name (First and Last) -->
      <div class="mb-3">
        <label class="form-label">Name:</label>
        <div class="row">
          <div class="col">
            <input type="text" class="form-control" placeholder="First name" />
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Last name" />
          </div>
        </div>
      </div>

      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label">User Name:</label>
        <input
          type="text"
          class="form-control"
          id="username"
          placeholder="Username"
        />
      </div>

      <!-- Phone Number -->
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number:</label>
        <input
          type="tel"
          class="form-control"
          id="phone"
          placeholder="Phone Number"
        />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="Password"
        />
      </div>

      <!-- 🔽 Dropdown Menu -->
      <div class="mb-3">
        <label for="dropdownSelect" class="form-label">{{ genreLabel }}</label>
        <select class="form-select" id="dropdownSelect">
          <option selected disabled>Choose an option</option>
          <option value="fiction">Fiction</option>
          <option value="action">Action</option>
          <option value="drama">Drama</option>
        </select>
      </div>
      <div class="d-flex justify-content-center">
        <button type="button" class="btn btn-dark w-50" (click)="submitForm()">Submit</button>
      </div>      
    </form>
  </div>
</div>
